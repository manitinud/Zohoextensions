<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>e-Invoice Print</title>
  <link rel="stylesheet" href="css/widget.css">
</head>
<body>
  <div class="panel">
    <header class="panel-head">
      <h1>e-Invoice Print</h1>
      <span class="inv-no" id="invoice-no"></span>
    </header>

    <div class="status status--info" id="status">Loading…</div>

    <div class="body">
      <div class="details" id="details"></div>
      <div class="qr-preview" id="qr-preview"></div>
    </div>

    <footer class="actions">
      <button type="button" class="btn btn-primary" id="print-btn" disabled>Print e-Invoice</button>
      <button type="button" class="btn" id="reload-btn">Refresh</button>
    </footer>

    <div id="diag" class="diag"></div>

    <p class="hint">
      Uses your own Zoho Books invoice template — the PDF is fetched as Books renders it, and
      the e-invoice band (QR, IRN, Ack No., Ack Date) is added to the top of every page. Details
      come from the e-invoice Books already filed for this invoice; there is nothing to enter.
    </p>
  </div>

  <script>
  /*
   * SDK loader.
   *
   * API Configurations are the only sanctioned way for this widget to call
   * Zoho Books, and the v1.0 SDK refuses them outright ("Api Configurations is
   * supported only for sdk versions above 2.0." — verbatim from a live org).
   * Zoho's own template still points at v1.0, so the 2.0 script is loaded
   * explicitly, with candidate URLs tried in order and v1.0 kept last so a
   * wrong guess degrades to the old behaviour instead of a dead widget. The
   * winning URL is recorded for the diagnostics panel.
   */
  (function () {
    var urls = [
      'https://static.zohocdn.com/zohofinance/v2.0/zf_sdk.js',
      'https://static.zohocdn.com/zohofinance/v2/zf_sdk.js',
      'https://js.zohostatic.com/zohofinance/v2.0/zf_sdk.js',
      'https://static.zohocdn.com/zohofinance/v1.0/zf_sdk.js'
    ];
    window.__sdkReady = new Promise(function (resolve) {
      if (window.ZFAPPS) { window.__sdkUrl = 'pre-provided'; return resolve(); }
      var i = 0;
      (function next() {
        if (i >= urls.length) { window.__sdkUrl = 'none loaded'; return resolve(); }
        var el = document.createElement('script');
        el.src = urls[i];
        el.onload = function () { window.__sdkUrl = urls[i]; resolve(); };
        el.onerror = function () { i++; next(); };
        document.head.appendChild(el);
      })();
    });
  })();
  </script>
  <script src="js/zf-client.js"></script>
  <script src="js/einvoice.js"></script>
  <script src="js/qr-image.js"></script>
  <script src="js/vendor-pdf-lib.js"></script>
  <script src="js/pdf-stamp.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
