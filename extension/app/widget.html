<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>e-Invoice Print</title>
  <link rel="stylesheet" href="css/widget.css">
</head>
<body>
  <div class="panel">
    <header class="panel-head">
      <h1>e-Invoice Print</h1>
      <span class="inv-no" id="invoice-no"></span>
    </header>

    <div class="status status--info" id="status">Loading…</div>

    <div class="body">
      <div class="details" id="details"></div>
      <div class="qr-preview" id="qr-preview"></div>
    </div>

    <footer class="actions">
      <button type="button" class="btn btn-primary" id="print-btn" disabled>Print e-Invoice</button>
      <button type="button" class="btn" id="reload-btn">Refresh</button>
    </footer>

    <p class="hint">
      Uses your own Zoho Books invoice template — the PDF is fetched as Books renders it, and
      the e-invoice band (QR, IRN, Ack No., Ack Date) is added to the top of every page. Details
      come from the e-invoice Books already filed for this invoice; there is nothing to enter.
    </p>
  </div>

  <script src="https://static.zohocdn.com/zohofinance/v1.0/zf_sdk.js"></script>
  <script src="js/zf-client.js"></script>
  <script src="js/einvoice.js"></script>
  <script src="js/qr-image.js"></script>
  <script src="js/vendor-pdf-lib.js"></script>
  <script src="js/pdf-stamp.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
