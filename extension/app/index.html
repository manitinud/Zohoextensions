<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>e-Invoice Print</title>
  <link rel="stylesheet" href="css/widget.css">
</head>
<body>
  <div class="panel">
    <header class="panel-head">
      <h1>e-Invoice Print</h1>
      <span class="inv-no" id="invoice-no"></span>
    </header>

    <div class="status status--info" id="status">Loading…</div>

    <div class="body">
      <div class="details" id="details"></div>
      <div class="qr-preview" id="qr-preview"></div>
    </div>

    <footer class="actions">
      <button type="button" class="btn btn-primary" id="print-btn" disabled>Print e-Invoice</button>
      <button type="button" class="btn" id="reload-btn">Refresh</button>
    </footer>

    <p class="hint">
      The e-invoice band — QR, IRN, Ack No. and Ack Date — repeats at the top of every
      printed page. Use your browser's <strong>Save as PDF</strong> destination to keep a copy.
    </p>
  </div>

  <script src="https://js.zohostatic.com/zohofinance/v1/zf_sdk.js"></script>
  <script src="js/vendor-qrcode.js"></script>
  <script src="js/vendor-qrcode-utf8.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/zf-client.js"></script>
  <script src="js/einvoice.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/print-doc.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
